name: Update citations

on:
  schedule:
    - cron: "17 9 * * 1"   # weekly, Mondays at 09:17 UTC
  workflow_dispatch:         # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation counts from Google Scholar (via SerpApi)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error::SERPAPI_KEY secret is not set (Scholar blocks GitHub's servers, so it's required here)."
            exit 1
          fi
          python scripts/update_citations.py

      - name: Commit if changed
        run: |
          # ignore the date stamp so we only commit when a number actually changed
          if git diff --quiet -I '"updated"' -- citations.json; then
            echo "No citation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add citations.json
          git commit -m "Update citation counts from Google Scholar"
          git push
